name: Build YAZ++ on Ubuntu

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Clone YAZ
        uses: actions/checkout@v6
        with:
          repository: indexdata/yaz
          path: yaz
          ref: master
          fetch-depth: 1
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake libtool gcc g++ make bison \
            tclsh xsltproc docbook docbook-xml docbook-xsl \
            pkg-config libxslt1-dev libgnutls28-dev libicu-dev libstemmer-dev

      - name: Run buildconf for YAZ
        working-directory: yaz
        run: ./buildconf.sh

      - name: Configure YAZ with GCC
        working-directory: yaz
        env:
          CC: gcc
          CFLAGS: -g -O2 -Wall
        run: ./configure --disable-shared --enable-static

      - name: Build YAZ with GCC
        working-directory: yaz
        run: make -j4

      - name: Run buildconf for YAZ++
        run: ./buildconf.sh

      - name: Configure YAZ++ with GCC
        env:
          CC: gcc
          CXX: g++
          CFLAGS: -g -O2 -Wall
          CXXFLAGS: -g -O2 -Wall
        run: ./configure --with-yaz=yaz --disable-shared --enable-static

      - name: Build and test YAZ++ with GCC
        run: make -j4 check

      - name: Build distribution archive
        run: make -j4 dist

      - name: Show build and test failures
        if: failure()
        run: |
          find . -type f \( -name config.log -o -name test-suite.log \) -print0 |
            while IFS= read -r -d '' log; do
              echo "::group::$log"
              cat "$log"
              echo "::endgroup::"
            done
